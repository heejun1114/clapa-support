<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계란찜기 레시피북 · CLAPA 고객지원센터</title>
<meta name="description" content="클래파 스테인리스 멀티찜기 계란찜기 레시피북 — 앱 설치나 다운로드 없이 바로 보기.">
<link rel="canonical" href="https://cs.clapa.kr/recipe-viewer.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fff'/%3E%3Cpath fill='%23111' transform='translate(5 7.67) scale(.12135)' d='M121 0H445V60H121A46 28 0 0 0 75 88V314A46 28 0 0 0 121 342H445V401H121A121 88 0 0 1 0 313V88A121 88 0 0 1 121 0Z'/%3E%3C/svg%3E">
<style>
  /* 2026-11-15: 사이트 흑백 톤(assets/site.css)과 같은 값 — 청록·베이지를 뺐다. 파비콘은 scripts/apply_redesign.py 가 맞춘다. */
  :root{
    --paper:#F4F4F3; --bar:rgba(255,255,255,.92); --ink:#2E2E2E; --muted:#666666;
    --link:#111111; --link-wash:#EDEDEC; --line:#E6E6E6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--paper); color:var(--ink); letter-spacing:-0.01em;
    -webkit-text-size-adjust:100%;
  }
  a{-webkit-tap-highlight-color:transparent;}
  .rv-bar{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:12px;
    height:56px;padding:0 clamp(12px,4vw,26px);
    background:var(--bar);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .rv-back{
    display:inline-flex;align-items:center;gap:6px;
    font-size:14px;font-weight:600;color:var(--link);
    min-height:44px;padding:0 12px 0 8px;border-radius:9px;text-decoration:none;   /* 누르는 높이 44px */
    transition:background .15s ease;
  }
  .rv-back:hover{background:var(--link-wash);}
  .rv-back:focus-visible{outline:2px solid #111;outline-offset:2px;}
  .rv-back svg{width:18px;height:18px;flex:none;}
  .rv-title{font-size:15px;font-weight:700;letter-spacing:-0.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rv-count{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;}
  .rv-pages{
    max-width:720px;margin:0 auto;
    padding:clamp(14px,3vw,26px) clamp(10px,3vw,20px) 60px;
    display:flex;flex-direction:column;gap:14px;
  }
  .rv-pages img{
    display:block;width:100%;height:auto;
    border-radius:10px;border:1px solid var(--line);background:#fff;
    box-shadow:0 8px 24px -18px rgba(0,0,0,.28);
  }
  .rv-foot{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 0;}
  @media (max-width:480px){
    .rv-count{display:none;}
  }
</style>
</head>
<body>
  <header class="rv-bar">
    <a class="rv-back" href="./" aria-label="고객지원센터 홈으로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>뒤로</a>
    <span class="rv-title">계란찜기 레시피북</span>
    <span class="rv-count">전 14페이지</span>
  </header>
  <main class="rv-pages">
    <img src="assets/recipes/pages/p01.jpg" alt="계란찜기 레시피북 1페이지" width="1080" height="1528" fetchpriority="high" decoding="async">
    <img src="assets/recipes/pages/p02.jpg" alt="계란찜기 레시피북 2페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p03.jpg" alt="계란찜기 레시피북 3페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p04.jpg" alt="계란찜기 레시피북 4페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p05.jpg" alt="계란찜기 레시피북 5페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p06.jpg" alt="계란찜기 레시피북 6페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p07.jpg" alt="계란찜기 레시피북 7페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p08.jpg" alt="계란찜기 레시피북 8페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p09.jpg" alt="계란찜기 레시피북 9페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p10.jpg" alt="계란찜기 레시피북 10페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p11.jpg" alt="계란찜기 레시피북 11페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p12.jpg" alt="계란찜기 레시피북 12페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p13.jpg" alt="계란찜기 레시피북 13페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <img src="assets/recipes/pages/p14.jpg" alt="계란찜기 레시피북 14페이지" width="1080" height="1528" loading="lazy" decoding="async">
    <p class="rv-foot">계란찜기 레시피북 · 전 14페이지</p>
  </main>
  <script>
  /* '뒤로' — 같은 탭에서 홈에서 들어왔으면 history.back()(모바일 뒤로가기 제스처와 일관),
     외부/직접 진입이면 홈으로 폴백. (href="./"는 JS 미동작 시 폴백) */
  (function () {
    var back = document.querySelector('.rv-back');
    if (!back) return;
    back.addEventListener('click', function (e) {
      e.preventDefault();
      var sameOrigin = document.referrer && document.referrer.indexOf(location.origin) === 0;
      if (history.length > 1 && sameOrigin) { history.back(); }
      else { location.href = './'; }
    });
  })();
  </script>
<script src="assets/track.js" defer></script>
</body>
</html>
